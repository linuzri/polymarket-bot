# Polymarket Bot Configuration

[api]
# Polygon chain ID (137 = mainnet)
chain_id = 137

[trading]
# Maximum position size in USDC
max_position = 100.0
# Minimum edge (%) before taking a trade
min_edge = 5.0
# Maximum number of concurrent positions
max_positions = 5

[risk]
# Maximum total exposure in USDC
max_exposure = 500.0
# Stop loss (% of position)
stop_loss = 20.0
# Take profit (% of position)
take_profit = 50.0

[strategy]
# Available: "simple", "news_arb", "liquidity"
active = "simple"
# How often to check for signals (seconds)
poll_interval = 30

[weather]
enabled = true
scan_interval_secs = 1800
min_edge = 0.12             # Was 0.15 — allow more trades through (Feb 28 analysis: 0 trades with old settings)
max_per_bucket = 15.0       # Was 30.0 — smaller positions, more diversification
max_total_exposure = 80.0   # Was 60.0 — earned back from batch sell
kelly_fraction = 0.25       # Quarter-Kelly: industry standard for prediction markets
kelly_bankroll = 90.0       # Was 120.0 — match approximate cash balance
noaa_warm_bias_f = 1.0      # Empirical warm bias correction for NOAA forecasts (°F)
open_meteo_bias_f = 0.0     # Open-Meteo raw model bias correction (°F). Set to 0 = no correction.
open_meteo_bias_c = 0.0     # Open-Meteo raw model bias correction (°C). Set to 0 = no correction.
min_market_price = 0.02     # Was 0.05 — opens cheap wide buckets (gopfan2 strategy)
min_edge_narrow = 0.45      # Was 0.25 — INCREASED: exact/narrow bets had 0% resolved win rate
min_our_probability = 0.60  # Raised back to default — enforce 60% probability gate
# Minimum degrees between forecast and bucket threshold to avoid borderline bets
forecast_buffer_f = 2.0   # Was 3.0 — less aggressive filtering
forecast_buffer_c = 1.0   # Was 2.0 — less aggressive filtering
# Note: Only cities that exist on Polymarket weather markets are included
# Checked Feb 21, 2026: los-angeles, denver, phoenix, houston, boston, minneapolis,
# tokyo, sydney, singapore, dubai, berlin, mumbai — NONE found on Polymarket
cities_us = ["nyc", "chicago", "miami", "atlanta", "seattle", "dallas"]
cities_intl = ["london", "seoul", "paris", "toronto", "buenos-aires", "ankara"]
# Wellington REMOVED Feb 28: -$14.02 P&L on $17.32 invested, 0 wins, 13 buys. Worst city by far.

# Laddering mode: spread small bets across adjacent buckets
enable_laddering = false
ladder_amount_per_bucket = 2.0       # USD per bucket in ladder mode
ladder_max_buckets = 5               # Max buckets to buy in a single market
ladder_min_model_prob = 0.05         # Only ladder buckets with >=5% model probability
ladder_max_market_price = 0.15
max_per_bucket_hard_cap = 4.0        # Hard cap: no single bucket gets more than $4       # Only buy buckets priced at or below 15 cents

[weather.scan_schedule]
# Trigger scans aligned with model release times (UTC hours)
# GFS publishes ~3.5h after init time, ECMWF ~6-7h after init
# These are approximate availability times, not init times
model_release_hours = [3, 5, 9, 11, 15, 17, 21, 23]
# Also run a scan every N minutes as a fallback
fallback_interval_minutes = 120
# Run an extra scan N minutes after each model release
post_release_delay_minutes = 15

[notifications]
# Telegram notifications
telegram_enabled = true
telegram_chat_id = "3588682"
